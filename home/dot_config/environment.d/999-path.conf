# Managed by chezmoi. Extends the PATH of the systemd user manager, so that GUI
# applications (launched from GNOME, not from a shell) see the same user binaries
# as an interactive shell does. ~/.profile is only sourced on Xorg sessions
# (/etc/gdm3/Xsession), never on Wayland.
#
# This file must sort after /usr/lib/environment.d/99-environment.conf and
# 990-snapd.conf: the former assigns PATH absolutely, clobbering any value set by
# an earlier-sorting file.
PATH=$HOME/.local/bin:$HOME/.local/share/mise/shims:$HOME/.local/share/JetBrains/Toolbox/scripts:$PATH
