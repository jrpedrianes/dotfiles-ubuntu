[settings]
pin = true
# Defaults to true. Since mise v2026.9.0 (https://github.com/jdx/mise/releases#release-v2026.9.0),
# when enabled it keeps the shims dir in PATH as a fallback on top of `mise activate`, so missing
# tools resolve through their shim and get installed lazily. Disabled to keep shims out of PATH.
not_found_auto_install = false

[env]
MC_DISABLE_PAGER = "true"

[tools]
bitwarden = "2026.4.1"
chezmoi = "2.70.2"
cosign = "3.0.6"
gh = "2.92.0"
jq = "1.8.1"
kubectl = "1.35.5"
usage = "4.0.0"
uv = "0.11.8"
yq = "4.53.2"
