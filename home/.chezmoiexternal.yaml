{{- /* Chezmoi External */ -}}

{{- /* Avoid IDE errors */ -}}

{{ $omzRevision := includeTemplate "get-github-head-revision" "ohmyzsh/ohmyzsh" }}
".oh-my-zsh":
  type: archive
  url: "https://github.com/ohmyzsh/ohmyzsh/archive/{{ $omzRevision }}.tar.gz"
  stripComponents: 1
  # waiting for https://github.com/twpayne/chezmoi/issues/1614#issuecomment-966524408
  # exact: true

{{ $zshSyntaxHighlightingRevision := includeTemplate "get-github-head-revision" "zsh-users/zsh-syntax-highlighting" }}
".oh-my-zsh/custom/plugins/zsh-syntax-highlighting":
  type: archive
  url: "https://github.com/zsh-users/zsh-syntax-highlighting/archive/{{ $zshSyntaxHighlightingRevision }}.tar.gz"
  stripComponents: 1
  exact: true

{{ $zshAutosuggestionsRevision := includeTemplate "get-github-head-revision" "zsh-users/zsh-autosuggestions" }}
".oh-my-zsh/custom/plugins/zsh-autosuggestions":
  type: archive
  url: "https://github.com/zsh-users/zsh-autosuggestions/archive/{{ $zshAutosuggestionsRevision }}.tar.gz"
  stripComponents: 1
  exact: true

{{ $zshCompletionsRevision := includeTemplate "get-github-head-revision" "zsh-users/zsh-completions" }}
".oh-my-zsh/custom/plugins/zsh-completions":
  type: archive
  url: "https://github.com/zsh-users/zsh-completions/archive/{{ $zshCompletionsRevision }}.tar.gz"
  stripComponents: 1
  exact: true

".local/bin/switcher":
  type: file
  url: "{{ gitHubLatestReleaseAssetURL "danielfoehrKn/kubeswitch" (printf "switcher_linux_%s" .chezmoi.arch) }}"
  executable: true

".local/bin/kubecolor":
  type: file
  url: "{{ gitHubLatestReleaseAssetURL "kubecolor/kubecolor" (printf "kubecolor_*_linux_%s.tar.gz" .chezmoi.arch) }}"
  filter:
    command: tar
    args: ["-x", "-z", "-O", "kubecolor"]
  executable: true

".local/bin/starship":
  type: file
  url: "{{ gitHubLatestReleaseAssetURL "starship/starship" (printf "starship-%s-unknown-linux-gnu.tar.gz" .uname_arch) }}"
  filter:
    command: tar
    args: ["-x", "-z", "-O", "starship"]
  executable: true

{{ $rtkTarget := "x86_64-unknown-linux-musl" }}
{{ if eq .chezmoi.arch "arm64" }}{{ $rtkTarget = "aarch64-unknown-linux-gnu" }}{{ end }}
".local/bin/rtk":
  type: file
  url: "{{ gitHubLatestReleaseAssetURL "rtk-ai/rtk" (printf "rtk-%s.tar.gz" $rtkTarget) }}"
  filter:
    command: tar
    args: ["-x", "-z", "-O", "rtk"]
  executable: true

{{/* Not a release asset, so we need the tag to build a raw.githubusercontent.com URL */}}
{{ $nerdFontsTag := (gitHubLatestRelease "ryanoasis/nerd-fonts").TagName }}
"{{ joinPath .fontsDir .terminalFont.fileName }}":
  type: file
  url: "https://raw.githubusercontent.com/ryanoasis/nerd-fonts/refs/tags/{{ $nerdFontsTag }}/patched-fonts/FiraCode/FiraCodeNerdFontMono-Regular.ttf"

{{ $jdtlsVersion := (gitHubLatestTag "eclipse-jdtls/eclipse.jdt.ls").Name | trimPrefix "v" }}
{{ $jdtlsBuild := includeTemplate "get-jdtls-build-timestamp" $jdtlsVersion }}
".local/share/jdtls":
  type: archive
  url: "https://download.eclipse.org/jdtls/milestones/{{ $jdtlsVersion }}/jdt-language-server-{{ $jdtlsVersion }}-{{ $jdtlsBuild }}.tar.gz"
  exact: true
